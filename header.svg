<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#12213a"/>
      <stop offset="45%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="45%" stop-color="#8FB9FF"/>
      <stop offset="55%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#E8ECF4"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cardEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5FB0FF"/>
      <stop offset="100%" stop-color="#1c3f66"/>
    </linearGradient>

    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGlow)"/>

  <!-- faint drifting grid -->
  <g stroke="#4F9EFF" stroke-opacity="0.06" stroke-width="1">
    <g>
      <line x1="0" y1="40" x2="1200" y2="40"/>
      <line x1="0" y1="90" x2="1200" y2="90"/>
      <line x1="0" y1="140" x2="1200" y2="140"/>
      <line x1="0" y1="190" x2="1200" y2="190"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="290" x2="1200" y2="290"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -50; 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pulsing accent glow behind the flip card -->
  <circle cx="880" cy="180" r="130" fill="#4F9EFF" opacity="0.10">
    <animate attributeName="r" values="120;150;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#4F9EFF">
    <circle cx="620" cy="80" r="2.4" opacity="0.7">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="100" r="2" opacity="0.6">
      <animate attributeName="cy" values="100;125;100" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="270" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="270;245;270" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="250" r="2.6" opacity="0.6">
      <animate attributeName="cy" values="250;275;250" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="65" r="2.2" opacity="0.5">
      <animate attributeName="cy" values="65;45;65" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.65;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- open to work pill, top right -->
  <g transform="translate(1010,32)">
    <rect x="-4" y="-18" width="182" height="34" rx="17" fill="#0f1c14" stroke="#33c46a" stroke-width="1.2"/>
    <circle cx="14" cy="-1" r="5" fill="#33c46a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="4" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8FE3AE">OPEN TO WORK</text>
  </g>

  <!-- name / role -->
  <text x="70" y="150" font-family="Inter, 'Segoe UI', sans-serif" font-size="46" font-weight="600" fill="url(#textGrad)">
    Sagar Prajapati
  </text>
  <text x="72" y="188" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" fill="#8B8B94" letter-spacing="0.3">
    Full-stack developer &amp; data/ML engineer — shipping PortfolioAI end-to-end
  </text>

  <!-- accent underline that draws itself in -->
  <rect x="72" y="206" width="0" height="3" rx="1.5" fill="#4F9EFF">
    <animate attributeName="width" values="0;340;340" keyTimes="0;0.4;1" dur="2.4s" fill="freeze"/>
  </rect>

  <!-- pseudo-3D flip card: resume PDF flips into a live website -->
  <g transform="translate(880,178)" filter="url(#softGlow)">
    <g id="flipGroup">
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 0.04 1; 0.04 1; 1 1; 1 1" keyTimes="0;0.28;0.5;0.72;1"
        dur="6s" repeatCount="indefinite"/>

      <g id="faceDoc">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.27;0.3;0.98;1" dur="6s" repeatCount="indefinite"/>
        <rect x="-95" y="-115" width="190" height="230" rx="10" fill="#101826" stroke="url(#cardEdge)" stroke-width="2"/>
        <rect x="-65" y="-80" width="130" height="10" rx="3" fill="#4F9EFF" opacity="0.85"/>
        <rect x="-65" y="-55" width="130" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="-38" width="95" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="-21" width="110" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="10" width="130" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="27" width="80" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="44" width="105" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="75" width="60" height="20" rx="5" fill="#4F9EFF" opacity="0.18" stroke="#4F9EFF" stroke-width="1"/>
        <text x="-45" y="89" font-family="Inter, sans-serif" font-size="10" fill="#4F9EFF">PDF</text>
      </g>

      <g id="faceSite" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.3;0.98;1" dur="6s" repeatCount="indefinite"/>
        <rect x="-95" y="-115" width="190" height="230" rx="10" fill="url(#browserGrad)" stroke="url(#cardEdge)" stroke-width="2"/>
        <rect x="-95" y="-115" width="190" height="26" rx="10" fill="#161f30"/>
        <circle cx="-79" cy="-102" r="3.5" fill="#ff5f57"/>
        <circle cx="-67" cy="-102" r="3.5" fill="#febc2e"/>
        <circle cx="-55" cy="-102" r="3.5" fill="#28c840"/>
        <rect x="-65" y="-72" width="130" height="34" rx="6" fill="#4F9EFF" opacity="0.22"/>
        <rect x="-55" y="-62" width="70" height="7" rx="3" fill="#4F9EFF"/>
        <rect x="-55" y="-48" width="45" height="5" rx="2.5" fill="#5a6479"/>
        <rect x="-65" y="-28" width="55" height="45" rx="6" fill="#1c2740"/>
        <rect x="-2" y="-28" width="55" height="45" rx="6" fill="#1c2740"/>
        <rect x="-65" y="27" width="130" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="44" width="90" height="6" rx="3" fill="#3a4658"/>
        <rect x="-65" y="75" width="60" height="20" rx="5" fill="#4F9EFF" opacity="0.9"/>
        <text x="-50" y="89" font-family="Inter, sans-serif" font-size="10" fill="#080808" font-weight="600">LIVE</text>
      </g>
    </g>
  </g>

  <g stroke="#4F9EFF" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 470 178 L 720 178">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 710 170 L 720 178 L 710 186"/>
  </g>
</svg>
