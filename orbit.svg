<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hubGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8FB9FF"/>
      <stop offset="55%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#1c3f66"/>
    </radialGradient>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="280" fill="#080808"/>

  <!-- orbit guide rings (static, faint) -->
  <ellipse cx="350" cy="140" rx="270" ry="95" fill="none" stroke="#4F9EFF" stroke-opacity="0.12" stroke-width="1"/>
  <ellipse cx="350" cy="140" rx="180" ry="62" fill="none" stroke="#4F9EFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- central hub -->
  <circle cx="350" cy="140" r="34" fill="url(#hubGrad)"/>
  <text x="350" y="147" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#080808" text-anchor="middle">SP</text>

  <!-- outer orbit: 5 satellites -->
  <g filter="url(#dotGlow)">
    <circle r="7" fill="#4F9EFF">
      <animateMotion dur="14s" repeatCount="indefinite" begin="0s"
        path="M 620,140 A 270,95 0 1,1 80,140 A 270,95 0 1,1 620,140"/>
      <animate attributeName="opacity" values="1;0.35;1;1" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;3.5;7;7" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#5fd0a0">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-2.8s"
        path="M 620,140 A 270,95 0 1,1 80,140 A 270,95 0 1,1 620,140"/>
      <animate attributeName="opacity" values="1;0.35;1;1" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-2.8s"/>
      <animate attributeName="r" values="7;3.5;7;7" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-2.8s"/>
    </circle>
    <circle r="7" fill="#c792ea">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-5.6s"
        path="M 620,140 A 270,95 0 1,1 80,140 A 270,95 0 1,1 620,140"/>
      <animate attributeName="opacity" values="1;0.35;1;1" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-5.6s"/>
      <animate attributeName="r" values="7;3.5;7;7" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-5.6s"/>
    </circle>
    <circle r="7" fill="#f2b04c">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-8.4s"
        path="M 620,140 A 270,95 0 1,1 80,140 A 270,95 0 1,1 620,140"/>
      <animate attributeName="opacity" values="1;0.35;1;1" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-8.4s"/>
      <animate attributeName="r" values="7;3.5;7;7" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-8.4s"/>
    </circle>
    <circle r="7" fill="#ff8fa3">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-11.2s"
        path="M 620,140 A 270,95 0 1,1 80,140 A 270,95 0 1,1 620,140"/>
      <animate attributeName="opacity" values="1;0.35;1;1" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-11.2s"/>
      <animate attributeName="r" values="7;3.5;7;7" keyTimes="0;0.25;0.5;1" dur="14s" repeatCount="indefinite" begin="-11.2s"/>
    </circle>
  </g>

  <!-- inner orbit: 4 satellites, opposite direction (reversed path) -->
  <g filter="url(#dotGlow)">
    <circle r="5.5" fill="#4F9EFF">
      <animateMotion dur="9s" repeatCount="indefinite" begin="0s"
        path="M 170,140 A 180,62 0 1,0 530,140 A 180,62 0 1,0 170,140"/>
      <animate attributeName="opacity" values="1;0.4;1;1" keyTimes="0;0.25;0.5;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="5.5" fill="#5fd0a0">
      <animateMotion dur="9s" repeatCount="indefinite" begin="-2.25s"
        path="M 170,140 A 180,62 0 1,0 530,140 A 180,62 0 1,0 170,140"/>
      <animate attributeName="opacity" values="1;0.4;1;1" keyTimes="0;0.25;0.5;1" dur="9s" repeatCount="indefinite" begin="-2.25s"/>
    </circle>
    <circle r="5.5" fill="#f2b04c">
      <animateMotion dur="9s" repeatCount="indefinite" begin="-4.5s"
        path="M 170,140 A 180,62 0 1,0 530,140 A 180,62 0 1,0 170,140"/>
      <animate attributeName="opacity" values="1;0.4;1;1" keyTimes="0;0.25;0.5;1" dur="9s" repeatCount="indefinite" begin="-4.5s"/>
    </circle>
    <circle r="5.5" fill="#c792ea">
      <animateMotion dur="9s" repeatCount="indefinite" begin="-6.75s"
        path="M 170,140 A 180,62 0 1,0 530,140 A 180,62 0 1,0 170,140"/>
      <animate attributeName="opacity" values="1;0.4;1;1" keyTimes="0;0.25;0.5;1" dur="9s" repeatCount="indefinite" begin="-6.75s"/>
    </circle>
  </g>
</svg>
